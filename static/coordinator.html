<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organ Relay Coordinator</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; place-items: center; padding: 24px; background: #000; text-align: center; }
  .phone { width: 100%; max-width: 380px; }
  #title { font-size: 24px; font-weight: 600; margin: 16px 0 6px; }
  #sub { min-height: 1.4em; }
  .ring { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 40px; background: #111; }
  .ringing .ring { background: var(--green); animation: pulse 1s infinite; }
  .listening .ring { background: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6) } 100% { box-shadow: 0 0 0 30px rgba(34,197,94,0) } }
  #answer { display: none; margin-top: 28px; width: 100%; padding: 16px; font-size: 18px; background: var(--green); color: #000; border: 0; font-weight: 700; }
  .ringing #answer { display: block; }
  #heard { margin-top: 18px; min-height: 1.4em; font-style: italic; }
  #opts { margin-top: 22px; display: none; gap: 8px; flex-direction: column; }
  .incall #opts { display: flex; }
  #opts button { text-align: left; }
  #opts small { display: block; color: var(--muted); }
  #note { margin-top: 30px; font-size: 12px; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="ring">📞</div>
  <div id="title">On call</div>
  <div id="sub" class="muted">Nothing needs you. You'll only hear from Organ Relay if a shipment is at risk.</div>
  <button id="answer">Answer</button>
  <div id="heard" class="muted"></div>
  <div id="opts"></div>
  <div id="note" class="muted"></div>
</div>
<script src="common.js"></script>
<script>
  // Browser stand-in for the coordinator's phone. With Twilio configured a real
  // call goes out too; this page is the no-keys fallback and works on stage.
  const phone = document.getElementById("phone");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let esc = null, mode = "idle", audio = null, ringTimer = null, tries = 0;

  function setMode(m) { mode = m; phone.className = "phone " + m; }

  function ring(on) {
    clearInterval(ringTimer);
    if (!on) return;
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      [0, 0.45].forEach((d) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 440; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.15, audio.currentTime + d); g.gain.setValueAtTime(0, audio.currentTime + d + 0.35);
        o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.4);
      });
    };
    beep(); ringTimer = setInterval(beep, 2000);
    OR.vibrate([500, 300, 500]);
  }

  function listen() {
    if (!SR) { document.getElementById("heard").textContent = "Speech recognition needs Chrome. Tap an option."; return; }
    setMode("incall listening");
    const r = new SR(); r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = async (ev) => {
      const said = ev.results[0][0].transcript;
      document.getElementById("heard").textContent = `“${said}”`;
      const res = await OR.post("/api/decide", { utterance: said, source: "coordinator voice" });
      if (!res.ok && tries++ < 2) {
        OR.speak("Sorry, I didn't catch that. " + choicesPrompt(), { onend: listen });
      }
    };
    r.onerror = () => setMode("incall");
    r.onend = () => { if (mode.includes("listening")) setMode("incall"); };
    r.start();
  }

  const choicesPrompt = () => "Say " + esc.options.map((o) => o.key).join(", or ") + ".";

  document.getElementById("answer").onclick = () => {
    ring(false); tries = 0;
    setMode("incall");
    document.getElementById("sub").textContent = esc.reason;
    OR.speak(esc.script, { interrupt: true, onend: listen });
  };

  function renderOptions() {
    const box = document.getElementById("opts");
    box.innerHTML = "";
    esc.options.forEach((o) => {
      const b = document.createElement("button");
      b.innerHTML = `<b>${o.label}</b><small>arrives in ${OR.fmtHM(o.eta_min)} · ${OR.fmtHM(o.margin_min)} to spare</small>`;
      b.onclick = () => OR.post("/api/decide", { choice: o.key, source: "coordinator tap" });
      box.appendChild(b);
    });
  }

  const onEvent = OR.eventStream("coordinator", (e) => {
    if (e.kind === "decision" && e.say && mode !== "idle") {
      OR.speak(e.say + " Thank you.", { interrupt: true });
    }
  });

  OR.connect((s) => {
    onEvent(s);
    document.getElementById("note").textContent = s.integrations.twilio
      ? "Twilio is configured: a real phone call is placed too."
      : "Twilio not configured: this page is the coordinator's phone.";
    const open = s.escalation && !s.escalation.decided;
    if (open && (!esc || esc.id !== s.escalation.id)) {
      esc = s.escalation; renderOptions();
      setMode("ringing");
      document.getElementById("title").textContent = "Organ Relay";
      document.getElementById("sub").textContent = `${s.organ_label} ${s.shipment_id} needs a decision`;
      document.getElementById("heard").textContent = "";
      ring(true);
    } else if (open) {
      esc = s.escalation; // script may have been upgraded by Claude
    } else if (!open && mode !== "idle") {
      ring(false); setMode("idle");
      const d = s.escalation && s.escalation.decided;
      document.getElementById("title").textContent = d ? `Decided: ${d.key}` : "On call";
      document.getElementById("sub").textContent = "Nothing needs you. You'll only hear from Organ Relay if a shipment is at risk.";
      esc = null;
    }
  });

  OR.startOverlay("Coordinator phone",
    "Leave this open. It stays silent until a shipment is at risk, then it rings. Answer and say your choice out loud.",
    async () => { audio = new (window.AudioContext || window.webkitAudioContext)(); await OR.wakeLock(); });
</script>
</body>
</html>
