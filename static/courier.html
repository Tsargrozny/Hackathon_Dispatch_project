<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organ Relay Courier</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; place-items: center; text-align: center; padding: 24px; background: #000; }
  #dot { width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 28px; background: var(--green); transition: background .6s; }
  #now { font-size: 26px; font-weight: 600; line-height: 1.3; max-width: 480px; }
  #who { margin-top: 10px; font-size: 14px; }
  #last { margin-top: 36px; font-size: 14px; min-height: 2.6em; color: var(--muted); max-width: 420px; }
  #legend { position: fixed; bottom: 14px; left: 0; right: 0; font-size: 11px; color: #555; }
  body.flash { animation: flash .5s ease 2; }
  @keyframes flash { 50% { background: #1f2937 } }
</style>
</head>
<body>
<div>
  <div id="dot"></div>
  <div id="now">Waiting for shipment…</div>
  <div id="who" class="muted"></div>
  <div id="last"></div>
</div>
<div id="legend">Phone stays in your pocket. Buzz patterns: ••• handoff · ▬ ▬ delay · ••••• reroute/decision · ▬▬ red alert</div>
<script src="common.js"></script>
<script>
  // Courier companion: almost no screen. Haptics + optional voice.
  const hasVibe = "vibrate" in navigator;
  const onEvent = OR.eventStream("courier", (e) => {
    OR.vibrate(e.vibrate || [120]);
    if (e.say) OR.speak(e.say);
    document.getElementById("last").textContent = `${e.clock} · ${e.text}`;
    document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash");
  });
  OR.connect((s) => {
    onEvent(s);
    document.getElementById("dot").style.background = OR.STATUS_COLORS[s.status];
    document.getElementById("now").textContent = s.delivered ? `Delivered to ${s.destination.short}` : s.leg.name;
    document.getElementById("who").textContent = s.delivered ? "" : `Custody: ${s.leg.custodian}`;
  });
  OR.startOverlay("Courier mode",
    hasVibe ? "Put the phone in your pocket. It buzzes when something needs you, and speaks the instruction."
            : "This browser can't vibrate (iPhone Safari). Voice prompts still work. Use an Android phone for haptics.",
    async () => { await OR.wakeLock(); OR.vibrate([80, 80, 80]); OR.speak("Courier mode on."); });
</script>
</body>
</html>
